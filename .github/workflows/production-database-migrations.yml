name: Production database migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to run EF migrations against PRODUCTION_DATABASE_URL.'
        required: true
        default: 'no'

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Run EF migrations
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ConnectionStrings__DreamTeamEverDbConnectionString: ${{ secrets.PRODUCTION_DATABASE_URL }}
      ASPNETCORE_ENVIRONMENT: Production

    defaults:
      run:
        working-directory: .

    steps:
      - name: Check secret is configured
        run: |
          if [ -z "$ConnectionStrings__DreamTeamEverDbConnectionString" ]; then
            echo "::error::Secret PRODUCTION_DATABASE_URL is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore MigrationService
        run: >
          dotnet restore
          "src/backend/Services/Migrators/DreamTeamEver.MigrationService/DreamTeamEver.MigrationService.csproj"

      - name: Run MigrationService
        run: |
          set -euo pipefail
          echo "::group::dotnet run MigrationService"
          dotnet run \
            --no-launch-profile \
            --project "src/backend/Services/Migrators/DreamTeamEver.MigrationService/DreamTeamEver.MigrationService.csproj" \
            -c Release \
            --verbosity minimal
          echo "::endgroup::"
